; /etc/supervisor/conf.d/fotsography-worker.conf
; Traite la file d'attente (notifications dans l'app et sur téléphone).
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start fotsography-worker:*
[program:fotsography-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/fotsography/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/fotsography/storage/logs/worker.log
stopwaitsecs=3600
