# /etc/nginx/sites-available/fotsography — à adapter (domaine, chemin, version PHP).
# HTTPS : sudo certbot --nginx -d studio.example.cm
server {
    listen 80;
    listen [::]:80;
    server_name studio.example.cm;
    root /var/www/fotsography/public;

    index index.php;
    charset utf-8;
    client_max_body_size 8M;   # logo du studio

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fichiers compilés : cache long (leurs noms changent à chaque build).
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Le service worker doit toujours être relu pour les mises à jour.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
